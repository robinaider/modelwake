[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "modelwake"
version = "0.2.0"
description = "Wake the right model — local-first LLM router with fallback chains and a SQLite cost ledger"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
keywords = ["llm", "routing", "ai-gateway", "cost-tracking", "agents"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
modelwake = "modelwake.cli:main"

[project.urls]
Homepage = "https://github.com/robinaider/modelwake"
Issues = "https://github.com/robinaider/modelwake/issues"

[tool.setuptools.packages.find]
where = ["src"]
